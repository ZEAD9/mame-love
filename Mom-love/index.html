
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أمي ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-hearts"></div>

    <main class="home">
        <div class="small-text">إلى أجمل أم في الدنيا</div>

        <h1>أمي الحبيبة ❤️</h1>

        <p>
            أنتِ أجمل نعمة في حياتي،
            وأغلى إنسانة في قلبي.
        </p>

        <div class="heart">♥</div>

        <button onclick="location.href='message.html'">
            ابدئي رحلتك يا أمي ❤️
        </button>

        <div class="footer">صُنع بكل الحب لأمي</div>
    </main>

    <script src="script.js"></script>
    <audio id="backgroundMusic" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("backgroundMusic");
music.volume = 0.15;

music.play().catch(() => {
    document.addEventListener("click", () => {
        music.play();
    }, { once: true });
});
</script>
</body>
</html>
